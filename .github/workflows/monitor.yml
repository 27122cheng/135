name: Monitor open plans

# Asks for every 5 minutes. **It does not get every 5 minutes.**
#
# Measured over the first 14 hours of this workflow existing: 8 runs, spaced
# 1–2.7 hours apart. GitHub deprioritises high-frequency schedules hard, and a
# low-traffic repo gets the worst of it — so `*/5` here buys roughly hourly, not
# five-minutely. (The 4-hourly refresh, by contrast, lands on time.)
#
# The cron stays at */5 because asking for more than you receive costs nothing
# and the throttling may ease. But anyone who actually needs 5-minute position
# monitoring should point an external pinger (cron-job.org and UptimeRobot both
# do it free) at /api/monitor instead of relying on this. The endpoint is
# idempotent and safe to call from both.
#
# Even at its best this is not an intraday execution tool: the price it reads is
# itself ~15 minutes delayed on the free tier, and the plans being watched are
# H4/D1 setups whose levels sit hours apart.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Two overlapping runs could both see "entry not yet touched" and then both
  # announce the entry.
  group: monitor-plans
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check every symbol's active plan
        env:
          # APP_URL is a public URL, not a credential, so it falls back to the
          # deployment this repo actually has. Requiring it as a secret meant
          # every scheduled run since these workflows landed failed on `exit 1`
          # before making a single request — a whole class of silent breakage
          # bought nothing, because the value was never secret in the first
          # place. A repository secret or variable still overrides it.
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://135-mu.vercel.app' }}
          # Optional. When the deployment has no CRON_SECRET the routes are
          # open and an empty bearer is accepted, so the schedule works before
          # anything is configured; setting it on both sides locks it down.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          # One request for all symbols: this only reads a cached quote per
          # symbol, so it fits comfortably inside the 60s function ceiling.
          status=$(curl --silent --show-error --location \
            --max-time 90 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --header "Authorization: Bearer ${CRON_SECRET:-}" \
            --output /tmp/monitor.json \
            --write-out "%{http_code}" \
            "$APP_URL/api/monitor") || status="000"

          echo "HTTP $status"
          head -c 2000 /tmp/monitor.json
          echo ""

          # 501 means no database configured yet — a setup gap, not a failure
          # worth a red run every five minutes.
          if [ "$status" = "501" ]; then
            echo "::warning::Monitor is not configured (no database). Skipping."
            exit 0
          fi
          [ "$status" = "200" ]
