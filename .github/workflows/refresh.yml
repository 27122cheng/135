name: Refresh signals

# Every 4 hours. This lives here rather than in vercel.json because Vercel's
# Hobby plan only permits one cron run per day — GitHub Actions has no such
# limit, so the schedule moved and the app just exposes /api/refresh.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  # A run that overlaps the next one would double-spend the free-tier API
  # budgets for no benefit.
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh each symbol
        env:
          # APP_URL is a public URL, not a credential, so it falls back to the
          # deployment this repo actually has. Requiring it as a secret meant
          # every scheduled run since these workflows landed failed on `exit 1`
          # before making a single request — a whole class of silent breakage
          # bought nothing, because the value was never secret in the first
          # place. A repository secret or variable still overrides it.
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://135-mu.vercel.app' }}
          # Optional. When the deployment has no CRON_SECRET the routes are
          # open and an empty bearer is accepted, so the schedule works before
          # anything is configured; setting it on both sides locks it down.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          # One request per symbol: the whole set does not fit inside Vercel
          # Hobby's 60s function ceiling, and a per-symbol failure then costs
          # only that symbol.
          symbols="EURUSD USDJPY GBPUSD XAUUSD NAS100 GER40 US30 WTI SPX500"
          failed=""
          skipped=""

          for symbol in $symbols; do
            echo "::group::$symbol"
            status=$(curl --silent --show-error --location \
              --max-time 90 \
              --retry 2 --retry-delay 10 --retry-all-errors \
              --header "Authorization: Bearer ${CRON_SECRET:-}" \
              --output "/tmp/$symbol.json" \
              --write-out "%{http_code}" \
              "$APP_URL/api/refresh?symbol=$symbol") || status="000"

            if [ "$status" = "200" ]; then
              echo "ok"
              head -c 400 "/tmp/$symbol.json"
            elif [ "$status" = "501" ]; then
              # No database configured yet. A setup gap, not a failure — the
              # same treatment the monitor already gives it, so an unfinished
              # deployment doesn't paint the Actions tab red every 4 hours.
              echo "::warning::$symbol skipped — no database configured"
              head -c 200 "/tmp/$symbol.json"
              skipped="$skipped $symbol"
            else
              echo "HTTP $status" >&2
              head -c 400 "/tmp/$symbol.json" >&2 || true
              failed="$failed $symbol"
            fi
            echo ""
            echo "::endgroup::"

            # The free data tiers are per-minute rate limited; pacing the loop
            # keeps a full refresh inside them instead of relying on backoff.
            sleep 20
          done

          if [ -n "$skipped" ]; then
            echo "Skipped (not configured):$skipped"
          fi
          if [ -n "$failed" ]; then
            echo "Failed symbols:$failed" >&2
            exit 1
          fi
